version: 2

models:
  - name: stg_trades
    columns:
      - name: trade_id
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null
      - name: size
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: stg_candles
    columns:
      - name: product_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["BTC-USD", "ETH-USD", "SOL-USD"]
      - name: day
        tests:
          - not_null
      - name: volume
        tests:
          - not_null
