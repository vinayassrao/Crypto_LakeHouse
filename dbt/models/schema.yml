version: 2

models:
  - name: stg_trades
    columns:
      - name: trade_id
        tests:
          - unique
          - not_null
      - name: price
        tests:
          - not_null
      - name: size
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null

  - name: stg_candles
    columns:
      - name: product_id
        tests:
          - not_null
      - name: day
        tests:
          - not_null
      - name: volume
        tests:
          - not_null

  - name: dim_pair
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: base_currency
        tests:
          - not_null
      - name: quote_currency
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["USD", "EUR", "GBP", "USDC", "USDT", "BTC", "ETH"]
