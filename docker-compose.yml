services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  warehouse:
    image: postgres:16
    container_name: warehouse
    profiles: ["docker-postgres"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-lake}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-lakepass}
      POSTGRES_DB: ${PG_DB:-warehouse}
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-lake} -d ${PG_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-db:
    image: postgres:16
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.9.0
    container_name: airflow
    depends_on:
      airflow-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PG_HOST: ${AIRFLOW_PG_HOST:-host.docker.internal}
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${PG_DB:-warehouse}
      PG_USER: ${PG_USER:-lake}
      PG_PASSWORD: ${PG_PASSWORD:-lakepass}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: >
      bash -c "airflow db migrate &&
        (airflow users create --username airflow --password airflow
          --firstname Admin --lastname User --role Admin
          --email admin@example.com || true) &&
        airflow standalone"

volumes:
  warehouse_data:
  airflow_db_data:
